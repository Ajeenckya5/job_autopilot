<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Autopilot — pick a direction</title>
  <style>
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; background: #111; color: #f4f1ea; }
    header { padding: 20px 24px 8px; }
    h1 { font-weight: 500; font-size: 22px; margin: 0 0 6px; }
    p { margin: 0; color: #c8c2b6; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 16px 24px; }
    figure { margin: 0; }
    figcaption { padding: 8px 4px 10px; font-size: 14px; }
    figcaption a { color: #f4f1ea; margin-right: 8px; }
    iframe { width: 100%; height: 720px; border: 0; background: #fff; border-radius: 8px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Four directions</h1>
    <p>Paper, Folio, and Carbon are editorial. Night is a dark product shell. Each caption jumps to tracker, empty, error, and dark.</p>
  </header>
  <div class="grid">
    <figure>
      <figcaption>
        Paper
        <a href="./paper.html#tracker">Tracker</a>
        <a href="./paper.html#empty">Empty</a>
        <a href="./paper.html#error">Error</a>
        <a href="./paper.html#dark">Dark</a>
      </figcaption>
      <iframe title="Paper" src="./paper.html"></iframe>
    </figure>
    <figure>
      <figcaption>
        Folio
        <a href="./folio.html#tracker">Tracker</a>
        <a href="./folio.html#empty">Empty</a>
        <a href="./folio.html#error">Error</a>
        <a href="./folio.html#dark">Dark</a>
      </figcaption>
      <iframe title="Folio" src="./folio.html"></iframe>
    </figure>
    <figure>
      <figcaption>
        Carbon
        <a href="./carbon.html#tracker">Tracker</a>
        <a href="./carbon.html#empty">Empty</a>
        <a href="./carbon.html#error">Error</a>
        <a href="./carbon.html#dark">Dark</a>
      </figcaption>
      <iframe title="Carbon" src="./carbon.html"></iframe>
    </figure>
    <figure>
      <figcaption>
        Night
        <a href="./night.html#tracker">Tracker</a>
        <a href="./night.html#empty">Empty</a>
        <a href="./night.html#error">Error</a>
      </figcaption>
      <iframe title="Night" src="./night.html"></iframe>
    </figure>
  </div>
</body>
</html>
