<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Autopilot — pick a direction</title>
  <style>
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; background: #111; color: #f4f1ea; }
    header { padding: 20px 24px 8px; }
    h1 { font-weight: 500; font-size: 22px; margin: 0 0 6px; }
    p { margin: 0; color: #c8c2b6; }
    nav { display: flex; gap: 16px; padding: 12px 24px 20px; }
    a { color: #f4f1ea; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px 24px; }
    figure { margin: 0; }
    figcaption { padding: 8px 4px; font-size: 14px; }
    iframe { width: 100%; height: 920px; border: 0; background: #fff; border-radius: 8px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Three directions</h1>
    <p>Paper, Folio, and Carbon. Light is on this page. Each caption links to the dark version.</p>
  </header>
  <nav>
    <a href="./paper.html">Paper</a>
    <a href="./paper.html?theme=dark">Paper dark</a>
    <a href="./folio.html">Folio</a>
    <a href="./folio.html?theme=dark">Folio dark</a>
    <a href="./carbon.html">Carbon</a>
    <a href="./carbon.html?theme=dark">Carbon dark</a>
  </nav>
  <div class="grid">
    <figure>
      <figcaption>Paper · <a href="./paper.html?theme=dark">dark</a></figcaption>
      <iframe title="Paper" src="./paper.html"></iframe>
    </figure>
    <figure>
      <figcaption>Folio · <a href="./folio.html?theme=dark">dark</a></figcaption>
      <iframe title="Folio" src="./folio.html"></iframe>
    </figure>
    <figure>
      <figcaption>Carbon · <a href="./carbon.html?theme=dark">dark</a></figcaption>
      <iframe title="Carbon" src="./carbon.html"></iframe>
    </figure>
  </div>
</body>
</html>
