name: job-autopilot

# Runs the scrape/score pipeline once a day, Monday to Friday. The scrape starts
# at exactly 5:00 PM Chicago time, so the jobs are fresh as of 5 PM, and both
# tracks' workbooks are emailed about an hour later.
# Scrape-only: manual_apply_only is forced on, so nothing is ever auto-applied
# to and no recruiter mail is sent.
#
# Starting on time without any outside service: GitHub starts scheduled runs
# hours late, so the run is scheduled for late morning and its first job only
# waits on the runner until 5:00 PM Chicago; nothing is scraped before then.
# The repo is public, so runner time is free.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   GEMINI_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY   - at least one
#   RESUME_AI_B64, RESUME_IE_B64                          - base64 of each resume PDF
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD                     - 16-char Google app password
#
# Note: shared GitHub runners use datacenter IPs, which LinkedIn and Indeed
# block far more aggressively than a home connection. Expect fewer results here
# than on a local run; the company-careers and jobright sources hold up better.

on:
  # 17:27 UTC is 11:27 AM Chicago in winter (CST), 12:27 PM in summer (CDT): up
  # to 5 hours 33 minutes of lead, more than the worst delay seen on this repo.
  # 18:27 UTC only matters on a day GitHub drops the first slot; otherwise it
  # sees that today's files already went out and stops in seconds.
  schedule:
    - cron: "27 17 * * 1-5"
    - cron: "27 18 * * 1-5"
  workflow_dispatch:
    inputs:
      track:
        description: "Which track to run"
        type: choice
        options: [both, ai, ie]
        default: both

permissions:
  contents: read

# Scheduled runs queue behind each other, so only one of them ever does the work.
# Manual runs have their own queue and never wait behind a scheduled run's wait.
concurrency:
  group: job-autopilot-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Wait until 5:00 PM Chicago, then check today's files are not sent yet
        id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Manual runs always go through, right away.
          if [ "$EVENT" != "schedule" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi

          # Wait here until 5:00 PM Chicago. A slot GitHub starts after that runs at once.
          now="${NOW:-$(date +%s)}"
          start="$(TZ=America/Chicago date -d "@$now" +%F)"
          target="$(TZ=America/Chicago date -d "$start 17:00" +%s)"
          wait=$(( target - now ))
          if [ "$wait" -gt $(( 340 * 60 )) ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: started $(( wait / 60 )) minutes before 5:00 PM, longer than a job can wait."
            exit 0
          fi
          if [ "$wait" -gt 0 ]; then
            echo "Waiting $(( wait / 60 )) minutes, until 5:00 PM Chicago."
            sleep "$wait"
          fi

          # One run a day: stop if another run today already sent the files, or a
          # manual run is sending them right now.
          today="$(TZ=America/Chicago date +%F)"
          sent=no
          while read -r id created status event || [ -n "$id" ]; do
            [ -n "$id" ] || continue
            [ "$(TZ=America/Chicago date -d "$created" +%F)" = "$today" ] || continue
            if [ "$event" = "workflow_dispatch" ] && [ "$status" != "completed" ]; then
              sent=yes; echo "Manual run $id is sending today's files."; break
            fi
            [ "$status" = "completed" ] || continue
            ok="$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                    --jq '[.jobs[] | select(.name | startswith("run ("))] | (length > 0 and all(.conclusion == "success"))')" || ok=unknown
            if [ "$ok" = "true" ]; then sent=yes; echo "Run $id already sent today's files."; break; fi
          done < <(gh api "repos/$REPO/actions/workflows/job-autopilot.yml/runs?per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $RUN_ID) | \"\(.id) \(.created_at) \(.status) \(.event)\"")

          if [ "$sent" = "yes" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: today's files already went out."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Starting the scrape for today's files."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [ai, ie]
    steps:
      - name: Skip track not selected
        id: gate
        run: |
          want="${{ github.event.inputs.track || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.track }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build track config
        if: steps.gate.outputs.run == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESUME_AI_B64: ${{ secrets.RESUME_AI_B64 }}
          RESUME_IE_B64: ${{ secrets.RESUME_IE_B64 }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python ci/build_config.py ${{ matrix.track }}

      - name: Scrape and score
        if: steps.gate.outputs.run == 'yes'
        run: python autopilot.py --config config_${{ matrix.track }}.yaml run
        continue-on-error: true

      - name: Email digest
        if: steps.gate.outputs.run == 'yes'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          label='${{ matrix.track == 'ai' && 'ML & AI' || 'Industrial & Ops' }}'
          python ci/send_digest.py --xlsx "out/${{ matrix.track }}/jobs.xlsx" --label "$label"

      - name: Upload workbook
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.track }}-jobs
          path: out/${{ matrix.track }}/jobs.xlsx
          if-no-files-found: warn
          retention-days: 30
