name: job-autopilot

# Runs the scrape/score pipeline in the cloud once a day at 5 PM Chicago time,
# Monday to Friday, and emails each track's workbook. Scrape-only:
# manual_apply_only is forced on, so nothing is ever auto-applied to and no
# recruiter mail is sent.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   GEMINI_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY   - at least one
#   RESUME_AI_B64, RESUME_IE_B64                          - base64 of each resume PDF
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD                     - 16-char Google app password
#
# Note: shared GitHub runners use datacenter IPs, which LinkedIn and Indeed
# block far more aggressively than a home connection. Expect fewer results here
# than on a local run; the company-careers and jobright sources hold up better.

on:
  # GitHub cron is UTC only. 5 PM Chicago is 23:00 UTC in winter (CST) and
  # 22:00 UTC in summer (CDT), so both are listed and the gate job below lets
  # through only the one that matches today's offset: one run per weekday.
  # Minute 7 avoids the top-of-hour queue, where GitHub delays or drops runs.
  schedule:
    - cron: "7 23 * * 1-5"
    - cron: "7 22 * * 1-5"
  workflow_dispatch:
    inputs:
      track:
        description: "Which track to run"
        type: choice
        options: [both, ai, ie]
        default: both

permissions:
  contents: read

concurrency:
  group: job-autopilot
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Keep only the 5 PM Chicago run
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # Manual runs always go through.
          if [ "$EVENT" != "schedule" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/Chicago date +%z)" = "-0600" ]; then want="7 23 * * 1-5"; else want="7 22 * * 1-5"; fi
          # Compare against the cron that fired, not the clock, so a late start still runs.
          if [ "$CRON" = "$want" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: '$CRON' is not 5 PM Chicago today."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [ai, ie]
    steps:
      - name: Skip track not selected
        id: gate
        run: |
          want="${{ github.event.inputs.track || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.track }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build track config
        if: steps.gate.outputs.run == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESUME_AI_B64: ${{ secrets.RESUME_AI_B64 }}
          RESUME_IE_B64: ${{ secrets.RESUME_IE_B64 }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python ci/build_config.py ${{ matrix.track }}

      - name: Scrape and score
        if: steps.gate.outputs.run == 'yes'
        run: python autopilot.py --config config_${{ matrix.track }}.yaml run
        continue-on-error: true

      - name: Email digest
        if: steps.gate.outputs.run == 'yes'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          label='${{ matrix.track == 'ai' && 'ML & AI' || 'Industrial & Ops' }}'
          python ci/send_digest.py --xlsx "out/${{ matrix.track }}/jobs.xlsx" --label "$label"

      - name: Upload workbook
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.track }}-jobs
          path: out/${{ matrix.track }}/jobs.xlsx
          if-no-files-found: warn
          retention-days: 30
