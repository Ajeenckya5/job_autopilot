name: job-autopilot

# Runs the scrape/score pipeline once a day, Monday to Friday, and emails each
# track's workbook by 6 PM Chicago time. GitHub often starts scheduled runs
# hours late and sometimes drops them, so there are several slots through the
# day: the first one GitHub delivers does the work and the rest skip themselves.
# Scrape-only: manual_apply_only is forced on, so nothing is ever auto-applied
# to and no recruiter mail is sent.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   GEMINI_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY   - at least one
#   RESUME_AI_B64, RESUME_IE_B64                          - base64 of each resume PDF
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD                     - 16-char Google app password
#
# Note: shared GitHub runners use datacenter IPs, which LinkedIn and Indeed
# block far more aggressively than a home connection. Expect fewer results here
# than on a local run; the company-careers and jobright sources hold up better.

on:
  # Weekday slots, in UTC because GitHub cron has no time zones. In Chicago they
  # are 9:37, 11:37, 1:37, 2:37 and 3:37 in winter (CST), an hour later in summer
  # (CDT). A run takes 45 to 75 minutes, so even a slot that starts a few hours
  # late lands before 6 PM. Minute 37 avoids the top-of-hour rush.
  schedule:
    - cron: "37 15 * * 1-5"
    - cron: "37 17 * * 1-5"
    - cron: "37 19 * * 1-5"
    - cron: "37 20 * * 1-5"
    - cron: "37 21 * * 1-5"
  workflow_dispatch:
    inputs:
      track:
        description: "Which track to run"
        type: choice
        options: [both, ai, ie]
        default: both

permissions:
  contents: read

concurrency:
  group: job-autopilot
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether this run goes ahead
        id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Manual runs always go through.
          if [ "$EVENT" != "schedule" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi

          # A scheduled slot goes ahead only if no earlier run today already sent
          # the files. Runs in this concurrency group never overlap, so any other
          # run is either finished or still waiting for its own turn.
          today="$(TZ=America/Chicago date +%F)"
          sent=no
          while read -r id created || [ -n "$id" ]; do
            [ -n "$id" ] || continue
            [ "$(TZ=America/Chicago date -d "$created" +%F)" = "$today" ] || continue
            ok="$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                    --jq '[.jobs[] | select(.name | startswith("run ("))] | (length > 0 and all(.conclusion == "success"))')" || ok=unknown
            if [ "$ok" = "true" ]; then sent=yes; echo "Run $id already sent today's files."; break; fi
          done < <(gh api "repos/$REPO/actions/workflows/job-autopilot.yml/runs?status=completed&per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $RUN_ID) | \"\(.id) \(.created_at)\"")

          if [ "$sent" = "yes" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: today's files already went out."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "No files sent yet today, so this slot runs."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        track: [ai, ie]
    steps:
      - name: Skip track not selected
        id: gate
        run: |
          want="${{ github.event.inputs.track || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.track }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build track config
        if: steps.gate.outputs.run == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESUME_AI_B64: ${{ secrets.RESUME_AI_B64 }}
          RESUME_IE_B64: ${{ secrets.RESUME_IE_B64 }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python ci/build_config.py ${{ matrix.track }}

      - name: Scrape and score
        if: steps.gate.outputs.run == 'yes'
        run: python autopilot.py --config config_${{ matrix.track }}.yaml run
        continue-on-error: true

      - name: Email digest
        if: steps.gate.outputs.run == 'yes'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          label='${{ matrix.track == 'ai' && 'ML & AI' || 'Industrial & Ops' }}'
          python ci/send_digest.py --xlsx "out/${{ matrix.track }}/jobs.xlsx" --label "$label"

      - name: Upload workbook
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.track }}-jobs
          path: out/${{ matrix.track }}/jobs.xlsx
          if-no-files-found: warn
          retention-days: 30
