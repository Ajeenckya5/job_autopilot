name: workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any Cloudflare account except the personal one
        run: |
          python3 - <<'PY'
          from pathlib import Path
          account = "ea080f698fdf34fa24a55dbd904ad90a"
          banned = (
              "dde444e43d06851a358dac78922dae7c",
              "df04bc5d-9fad-4cc5-9d1f-c79b9a0b2896",
              "58de046ae4204473a76cf75b16188250",
          )
          files = [Path("worker/wrangler.toml"), Path("worker/wrangler.push.toml")]
          text = "\n".join(path.read_text() for path in files)
          if text.count(f'account_id = "{account}"') != len(files):
              raise SystemExit("every wrangler config must set the personal account_id")
          for item in banned:
              if item in text:
                  raise SystemExit("a wrangler config still names the other account")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker dependencies
        working-directory: worker
        run: npm install
      - name: Set the push signing keys and the feed ingest token
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea080f698fdf34fa24a55dbd904ad90a
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "$INGEST_TOKEN" ]; then
            printf '%s' "$INGEST_TOKEN" | npx --yes wrangler@4.138.0 secret put INGEST_TOKEN
          fi
          printf '%s' "$VAPID_PUBLIC_KEY" | npx --yes wrangler@4.138.0 secret put VAPID_PUBLIC_KEY
          printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@4.138.0 secret put VAPID_PRIVATE_KEY
          printf '%s' "$VAPID_PUBLIC_KEY" | npx --yes wrangler@4.138.0 secret put VAPID_PUBLIC_KEY --config wrangler.push.toml
          printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@4.138.0 secret put VAPID_PRIVATE_KEY --config wrangler.push.toml
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ea080f698fdf34fa24a55dbd904ad90a
          wranglerVersion: "4.138.0"
          workingDirectory: worker
          command: d1 migrations apply jobs --remote
      - name: Deploy the jobs API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ea080f698fdf34fa24a55dbd904ad90a
          wranglerVersion: "4.138.0"
          workingDirectory: worker
          command: deploy
      - name: Deploy push
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ea080f698fdf34fa24a55dbd904ad90a
          wranglerVersion: "4.138.0"
          workingDirectory: worker
          command: deploy --config wrangler.push.toml
