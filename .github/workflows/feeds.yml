name: feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Send the whole feed to the jobs API, not only changes"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog, gate, and committed feed
        run: |
          pip install pyyaml
          python feed-builder/test_coverage.py
          python feed-builder/build_feeds.py --check
          if [ -d feeds ]; then python feed-builder/build_feeds.py --audit-dir feeds; fi

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: pip install pyyaml && FEED_OUT="$GITHUB_WORKSPACE/feeds" python feed-builder/build_feeds.py
      - name: Send new and changed jobs to the jobs API
        # Before the commit, so the rebuilt feed can be compared with the last one. A failed send
        # never blocks publishing the feed.
        continue-on-error: true
        timeout-minutes: 25
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          (cd feed-builder && python -m unittest -q test_push)
          python feed-builder/push_to_api.py ${{ github.event.inputs.all == 'true' && '--all' || '' }}
      - name: Keep the schedule active
        run: date -u +%Y-%m-%dT%H:%M:%SZ
      - name: Publish the feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update the company job feed."
          git push
