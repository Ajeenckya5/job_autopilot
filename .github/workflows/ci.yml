name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright
        run: npx playwright test e2e/journey.spec.js e2e/storage.spec.js e2e/keyboard.spec.js e2e/count.spec.js e2e/tracker.spec.js e2e/why-not.spec.js
        env:
          CI: "true"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: API tests
        run: npm test
      - name: Migrations apply on a local D1
        # D1 has limits plain SQLite does not, such as an expression depth of 100.
        run: npx --yes wrangler@4.138.0 d1 migrations apply jobs --local
